<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cambio VE — Bolívares y USDT</title>
<meta name="description" content="Calculadora rápida de bolívares a USD usando la tasa BCV y la tasa P2P.">
<meta name="theme-color" content="#145C43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cambio VE">
<link rel="manifest" href="/xcambio/manifest.json">
<link rel="icon" href="/xcambio/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/xcambio/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="ticket" id="ticket">

  <header class="ticket__head">
    <h1>CambioX</h1>
    <p class="ticket__sub">Bolívares ⇄ USD</p>
  </header>

  <div class="tear" aria-hidden="true"></div>

  <section class="value-stack" aria-label="Valores a convertir">

    <div class="calc__field">
      <div class="calc__input-wrap calc__input-wrap--static">
        <div class="calc__input-copy">
          <span class="calc__tag">Bolívares</span>
          <input type="number" inputmode="decimal" id="bs-input" step="0.01" min="0" aria-label="Bolívares" autofocus />
        </div>
      </div>
    </div>

    <div class="calc__field">
      <div class="calc__input-wrap calc__input-wrap--static">
        <div class="calc__input-copy">
          <span class="calc__tag">USD BCV</span>
          <input type="number" inputmode="decimal" id="bcv-usd-input" step="0.01" min="0" aria-label="USD BCV" />
        </div>
      </div>
    </div>

    <div class="calc__field calc__field--result">
      <div class="calc__input-wrap calc__input-wrap--result calc__input-wrap--static">
        <div class="calc__input-copy">
          <span class="calc__tag">USD P2P</span>
          <input type="number" inputmode="decimal" id="parallel-usd-input" step="0.01" min="0" aria-label="USD paralelo / P2P" />
        </div>
      </div>
    </div>

  </section>

  <div class="tear" aria-hidden="true"></div>

  <section class="rates" aria-label="Tasas de cambio">
    <div class="rates__header">
      <span>Tasa de referencia</span>
      <div class="rates__actions">
        <span class="refresh-status" id="refresh-status" role="status" aria-live="polite"></span>
        <button type="button" id="refresh-rates-btn" class="refresh-btn" aria-label="Actualizar tasas">↻</button>
      </div>
    </div>

    <div class="rate-row" id="bcv-row">
      <div class="rate-row__label">
        <span>BCV oficial</span>
        <span class="rate-row__meta" id="bcv-meta">cargando…</span>
      </div>
      <div class="rate-row__value">
        <span class="rate-row__prefix">Bs.</span>
        <input type="number" inputmode="decimal" id="bcv-rate-input" step="0.01" min="0" placeholder="0,00" />
      </div>
    </div>

    <div class="rate-row" id="parallel-row">
      <div class="rate-row__label">
        <span>Paralelo / P2P</span>
        <span class="rate-row__meta" id="parallel-meta">cargando…</span>
      </div>
      <div class="rate-row__value">
        <span class="rate-row__prefix">Bs.</span>
        <input type="number" inputmode="decimal" id="parallel-rate-input" step="0.01" min="0" placeholder="0,00" required />
      </div>
    </div>
  </section>

  <div class="tear" aria-hidden="true"></div>

  <footer class="reference" id="reference">
    <span id="gap-text">Ingresa un valor o actualiza las tasas para ver la brecha</span>
  </footer>

</main>

<p class="disclaimer">Ambas tasas toman como referencia dollarapi.com.</p>

<script src="app.js"></script>
</body>
</html>
